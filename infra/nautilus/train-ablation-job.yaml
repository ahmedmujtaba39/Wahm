apiVersion: batch/v1
kind: Job
metadata:
  name: wahm-judge-input-ablation
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: wahm
    wahm/stage: judge-input-ablation
spec:
  activeDeadlineSeconds: 604800
  backoffLimit: 3
  completions: 3
  parallelism: 3
  completionMode: Indexed
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahm
        wahm/stage: judge-input-ablation
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      containers:
        - name: train
          image: pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              variants=(answer_only gold_answer question_gold_answer)
              variant="${variants[JOB_COMPLETION_INDEX]}"
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              git clone "${WAHM_GIT_REPOSITORY}" /tmp/wahm
              git -C /tmp/wahm checkout --detach "${WAHM_GIT_COMMIT}"
              python -m pip install --no-cache-dir -r /tmp/wahm/requirements-judge.txt
              python /tmp/wahm/scripts/verify_hf_snapshot.py \
                --audit /workspace/artifacts/wahm-arabert-cache-audit.json \
                --model-id "${WAHM_JUDGE_MODEL}" \
                --revision "${WAHM_JUDGE_REVISION}"
              model_snapshot=$(python - <<'PY'
              import json
              from pathlib import Path
              audit = json.loads(Path(
                  "/workspace/artifacts/wahm-arabert-cache-audit.json"
              ).read_text(encoding="utf-8"))
              print(Path(audit["snapshot_dir"]))
              PY
              )
              python - <<'PY'
              import torch
              if not torch.cuda.is_available():
                  raise SystemExit("CUDA is unavailable inside the training pod")
              print(torch.cuda.get_device_name(0))
              PY
              output="/workspace/results/wahm-judge-ablation/${WAHM_GIT_COMMIT}/${variant}"
              cd /tmp/wahm
              python train_judge.py \
                --data judge_train.csv \
                --model "${model_snapshot}" \
                --model-source-id "${WAHM_JUDGE_MODEL}" \
                --model-revision "${WAHM_JUDGE_REVISION}" \
                --output "${output}" \
                --input-variant "${variant}" \
                --skip-test-evaluation \
                --test-fold 0 \
                --validation-fold 0 \
                --epochs 3 \
                --batch-size 8 \
                --gradient-accumulation 2
          env:
            - name: WAHM_GIT_COMMIT
              value: __WAHM_GIT_COMMIT__
            - name: WAHM_GIT_REPOSITORY
              value: https://github.com/cyberuniversal/Wahm.git
            - name: WAHM_JUDGE_MODEL
              value: aubmindlab/bert-base-arabertv2
            - name: WAHM_JUDGE_REVISION
              value: 97522efce17efa33036ac619802d5cec238dcad9
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: WANDB_DISABLED
              value: "true"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: wahm-judge-539948
