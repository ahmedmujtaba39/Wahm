apiVersion: batch/v1
kind: Job
metadata:
  name: wahm-judge-train
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: wahm
    wahm/stage: judge-train
spec:
  activeDeadlineSeconds: 604800
  backoffLimit: 3
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahm
        wahm/stage: judge-train
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-TITAN-RTX
                      - Quadro-RTX-6000
                      - Tesla-T4
                      - Tesla-V100-SXM2-32GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-PCIE-16GB
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
      containers:
        - name: train
          image: pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              repo="/workspace/repos/wahm-${WAHM_GIT_COMMIT}"
              if [[ ! -d "${repo}/.git" ]]; then
                git clone "${WAHM_GIT_REPOSITORY}" "${repo}"
              fi
              git -C "${repo}" fetch origin
              git -C "${repo}" checkout --detach "${WAHM_GIT_COMMIT}"
              python -m pip install --no-cache-dir -r "${repo}/requirements-judge.txt"
              python "${repo}/scripts/verify_hf_snapshot.py" \
                --audit /workspace/artifacts/wahm-arabert-cache-audit.json \
                --model-id "${WAHM_JUDGE_MODEL}" \
                --revision "${WAHM_JUDGE_REVISION}"
              model_snapshot=$(python - <<'PY'
              import json
              from pathlib import Path
              audit = json.loads(Path(
                  "/workspace/artifacts/wahm-arabert-cache-audit.json"
              ).read_text(encoding="utf-8"))
              snapshot = Path(audit["snapshot_dir"])
              if not snapshot.is_dir():
                  raise SystemExit(f"cached model snapshot is missing: {snapshot}")
              print(snapshot)
              PY
              )
              python - <<'PY'
              import torch
              if not torch.cuda.is_available():
                  raise SystemExit("CUDA is unavailable inside the training pod")
              print(torch.cuda.get_device_name(0))
              PY
              output="/workspace/results/wahm-judge/${WAHM_GIT_COMMIT}/arabert-gold-answer"
              mkdir -p "${output}"
              cd "${repo}"
              python train_judge.py \
                --model "${model_snapshot}" \
                --model-source-id "${WAHM_JUDGE_MODEL}" \
                --model-revision "${WAHM_JUDGE_REVISION}" \
                --output "${output}" \
                --test-fold 0 \
                --validation-fold 0 \
                --epochs 3 \
                --batch-size 8 \
                --gradient-accumulation 2
              python - <<'PY' > /dev/termination-log
              import hashlib
              import json
              import os
              from pathlib import Path
              metadata_path = (Path("/workspace/results/wahm-judge") /
                               os.environ["WAHM_GIT_COMMIT"] /
                               "arabert-gold-answer/judge_metadata.json")
              raw = metadata_path.read_bytes()
              metadata = json.loads(raw)
              print(json.dumps({
                  "metadata_sha256": hashlib.sha256(raw).hexdigest(),
                  "base_model": metadata["base_model"],
                  "base_model_revision": metadata["base_model_revision"],
                  "decision_threshold": metadata["decision_threshold"],
                  "validation_metrics": metadata["validation_metrics"],
                  "test_metrics": metadata["test_metrics"],
                  "n_train": metadata["n_train"],
                  "n_validation": metadata["n_validation"],
                  "n_test": metadata["n_test"],
                  "versions": metadata["versions"],
              }, sort_keys=True))
              PY
          env:
            - name: WAHM_GIT_COMMIT
              value: __WAHM_GIT_COMMIT__
            - name: WAHM_GIT_REPOSITORY
              value: https://github.com/cyberuniversal/Wahm.git
            - name: WAHM_JUDGE_MODEL
              value: aubmindlab/bert-base-arabertv2
            - name: WAHM_JUDGE_REVISION
              value: 97522efce17efa33036ac619802d5cec238dcad9
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: WANDB_DISABLED
              value: "true"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: wahm-judge-539948
