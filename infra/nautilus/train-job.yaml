apiVersion: batch/v1
kind: Job
metadata:
  name: wahm-judge-train
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: wahm
    wahm/stage: judge-train
spec:
  activeDeadlineSeconds: 604800
  backoffLimit: 3
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahm
        wahm/stage: judge-train
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-TITAN-RTX
                      - Quadro-RTX-6000
                      - Tesla-T4
                      - Tesla-V100-SXM2-32GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-PCIE-16GB
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
      containers:
        - name: train
          image: pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              repo="/workspace/repos/wahm-${WAHM_GIT_COMMIT}"
              git -C "${repo}" checkout --detach "${WAHM_GIT_COMMIT}"
              python -m pip install --no-cache-dir -r "${repo}/requirements-judge.txt"
              python "${repo}/scripts/verify_hf_snapshot.py" \
                --audit /workspace/artifacts/wahm-arabert-cache-audit.json \
                --model-id "${WAHM_JUDGE_MODEL}" \
                --revision "${WAHM_JUDGE_REVISION}"
              python - <<'PY'
              import torch
              if not torch.cuda.is_available():
                  raise SystemExit("CUDA is unavailable inside the training pod")
              print(torch.cuda.get_device_name(0))
              PY
              output="/workspace/results/wahm-judge/${WAHM_GIT_COMMIT}/arabert-gold-answer"
              mkdir -p "${output}"
              cd "${repo}"
              python train_judge.py \
                --model "${WAHM_JUDGE_MODEL}" \
                --model-revision "${WAHM_JUDGE_REVISION}" \
                --output "${output}" \
                --test-fold 0 \
                --validation-fold 0 \
                --epochs 3 \
                --batch-size 8 \
                --gradient-accumulation 2
          env:
            - name: WAHM_GIT_COMMIT
              value: __WAHM_GIT_COMMIT__
            - name: WAHM_JUDGE_MODEL
              value: aubmindlab/bert-base-arabertv2
            - name: WAHM_JUDGE_REVISION
              value: 97522efce17efa33036ac619802d5cec238dcad9
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: WANDB_DISABLED
              value: "true"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: wahm-judge-539948
