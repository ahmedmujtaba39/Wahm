apiVersion: batch/v1
kind: Job
metadata:
  name: wahm-layer2-variants
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: wahm
    wahm/stage: layer2-variants
spec:
  activeDeadlineSeconds: 604800
  backoffLimit: 3
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahm
        wahm/stage: layer2-variants
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - v100-cc-star-01.noc.ucsb.edu
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-TITAN-RTX
                      - Quadro-RTX-6000
                      - Tesla-T4
                      - Tesla-V100-SXM2-32GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-PCIE-16GB
      containers:
        - name: train
          image: pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              repo="/workspace/repos/wahm-${WAHM_GIT_COMMIT}"
              [[ "$(cat /workspace/prepared-commit.txt)" == "${WAHM_GIT_COMMIT}" ]]
              python_bin=/workspace/venv/bin/python
              "${python_bin}" "${repo}/scripts/verify_hf_snapshot.py" \
                --audit /workspace/artifacts/wahm-arabert-cache-audit.json \
                --model-id "${WAHM_JUDGE_MODEL}" \
                --revision "${WAHM_JUDGE_REVISION}"
              model_snapshot=$("${python_bin}" - <<'PY'
              import json
              from pathlib import Path
              audit = json.loads(Path(
                  "/workspace/artifacts/wahm-arabert-cache-audit.json"
              ).read_text(encoding="utf-8"))
              print(audit["snapshot_dir"])
              PY
              )
              "${python_bin}" - <<'PY'
              import torch
              if not torch.cuda.is_available():
                  raise SystemExit("CUDA is unavailable inside the training pod")
              print(torch.cuda.get_device_name(0))
              PY
              output="/workspace/results/wahm-layer2/${WAHM_GIT_COMMIT}"
              mkdir -p "${output}"
              cd "${repo}"
              "${python_bin}" train_layer2_variants.py \
                --data judge_train.csv \
                --model "${model_snapshot}" \
                --model-source-id "${WAHM_JUDGE_MODEL}" \
                --model-revision "${WAHM_JUDGE_REVISION}" \
                --output "${output}" \
                --epochs 3 \
                --batch-size 8 \
                --eval-batch-size 32 \
                2>&1 | tee "${output}/training.log"
              "${python_bin}" - <<'PY' > /dev/termination-log
              import json
              import os
              from pathlib import Path
              summary = json.loads((Path("/workspace/results/wahm-layer2") /
                                    os.environ["WAHM_GIT_COMMIT"] /
                                    "run_summary.json").read_text(encoding="utf-8"))
              print(json.dumps(summary, sort_keys=True))
              PY
          env:
            - name: WAHM_GIT_COMMIT
              value: __WAHM_GIT_COMMIT__
            - name: WAHM_GIT_REPOSITORY
              value: https://github.com/cyberuniversal/Wahm.git
            - name: WAHM_JUDGE_MODEL
              value: aubmindlab/bert-base-arabertv2
            - name: WAHM_JUDGE_REVISION
              value: 97522efce17efa33036ac619802d5cec238dcad9
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: WANDB_DISABLED
              value: "true"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: wahm-layer2-final-539948
