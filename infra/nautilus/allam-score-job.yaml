apiVersion: batch/v1
kind: Job
metadata:
  name: wahm-allam-score
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: wahm
    wahm/stage: allam-score
spec:
  activeDeadlineSeconds: 7200
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahm
        wahm/stage: allam-score
    spec:
      restartPolicy: Never
      containers:
        - name: score
          image: pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              git clone "${WAHM_GIT_REPOSITORY}" /tmp/wahm
              git -C /tmp/wahm checkout --detach "${WAHM_GIT_COMMIT}"
              python -m pip install --no-cache-dir -r /tmp/wahm/requirements-judge.txt
              run_dir="/results/results/wahm-generations/${WAHM_RUN_COMMIT}/allam"
              model_dir="/models/results/wahm-layer2/${WAHM_LAYER2_RUN}/arabert_judge_gold_answer"
              test -s "${run_dir}/generations.csv"
              test -s "${model_dir}/model.safetensors"
              cd /tmp/wahm
              python score_layer1.py \
                --input "${run_dir}/generations.csv" \
                --output "${run_dir}/scores_layer1.csv"
              python score_layer2.py \
                --input "${run_dir}/scores_layer1.csv" \
                --model "${model_dir}" \
                --output "${run_dir}/scores_combined.csv" \
                --threshold 0.5 \
                --batch-size 32
              python - <<'PY' > /dev/termination-log
              import csv, hashlib, json, os
              from collections import Counter
              from pathlib import Path

              path = (Path('/results/results/wahm-generations') /
                      os.environ['WAHM_RUN_COMMIT'] /
                      'allam/scores_combined.csv')
              raw = path.read_bytes()
              rows = list(csv.DictReader(raw.decode('utf-8').splitlines()))
              print(json.dumps({
                  'path': str(path),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'rows': len(rows),
                  'layer1': dict(Counter(r['layer1_decision'] for r in rows)),
                  'combined': dict(Counter(r['combined_decision'] for r in rows)),
                  'layer2_scored': sum(bool(r['layer2_hallucination_probability'])
                                       for r in rows),
              }, sort_keys=True))
              PY
          env:
            - name: WAHM_GIT_REPOSITORY
              value: https://github.com/ahmedmujtaba39/Wahm.git
            - name: WAHM_GIT_COMMIT
              value: 48f4644
            - name: WAHM_RUN_COMMIT
              value: allam-a28dd1e-48f4644
            - name: WAHM_LAYER2_RUN
              value: c234f9c79a394f1d415314217c93af1326f41e48
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: WANDB_DISABLED
              value: "true"
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: results
              mountPath: /results
            - name: layer2
              mountPath: /models
              readOnly: true
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: wahm-allam-539948
        - name: layer2
          persistentVolumeClaim:
            claimName: wahm-layer2-final-539948
            readOnly: true
