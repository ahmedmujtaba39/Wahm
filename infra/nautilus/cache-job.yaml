apiVersion: batch/v1
kind: Job
metadata:
  name: wahm-judge-cache
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: wahm
    wahm/stage: judge-cache
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahm
        wahm/stage: judge-cache
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
        - name: cache
          image: python:3.11-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              repo="/workspace/repos/wahm-${WAHM_GIT_COMMIT}"
              if [[ ! -d "${repo}/.git" ]]; then
                git clone "${WAHM_GIT_REPOSITORY}" "${repo}"
              fi
              git -C "${repo}" fetch origin
              git -C "${repo}" checkout --detach "${WAHM_GIT_COMMIT}"
              python -m pip install --no-cache-dir "huggingface-hub>=0.26,<1"
              python "${repo}/scripts/cache_hf_snapshot.py" \
                --model-id "${WAHM_JUDGE_MODEL}" \
                --revision "${WAHM_JUDGE_REVISION}" \
                --cache-dir /workspace/hf-cache \
                --output /workspace/artifacts/wahm-arabert-cache-audit.json
          env:
            - name: WAHM_GIT_COMMIT
              value: __WAHM_GIT_COMMIT__
            - name: WAHM_GIT_REPOSITORY
              value: https://github.com/cyberuniversal/Wahm.git
            - name: WAHM_JUDGE_MODEL
              value: aubmindlab/bert-base-arabertv2
            - name: WAHM_JUDGE_REVISION
              value: 97522efce17efa33036ac619802d5cec238dcad9
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: HF_HUB_DISABLE_XET
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: wahm-judge-539948
