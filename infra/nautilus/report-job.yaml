apiVersion: batch/v1
kind: Job
metadata:
  name: wahm-judge-report
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: wahm
    wahm/stage: judge-report
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahm
        wahm/stage: judge-report
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: python:3.11-slim
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -eu
              python - <<'PY' | tee /dev/termination-log
              import hashlib
              import json
              import os
              from pathlib import Path
              metadata_path = (Path("/workspace/results/wahm-judge") /
                               os.environ["WAHM_GIT_COMMIT"] /
                               "arabert-gold-answer/judge_metadata.json")
              raw = metadata_path.read_bytes()
              metadata = json.loads(raw)
              print(json.dumps({
                  "metadata_path": str(metadata_path),
                  "metadata_sha256": hashlib.sha256(raw).hexdigest(),
                  "base_model": metadata["base_model"],
                  "base_model_revision": metadata["base_model_revision"],
                  "decision_threshold": metadata["decision_threshold"],
                  "validation_metrics": metadata["validation_metrics"],
                  "test_metrics": metadata["test_metrics"],
                  "n_train": metadata["n_train"],
                  "n_validation": metadata["n_validation"],
                  "n_test": metadata["n_test"],
                  "versions": metadata["versions"],
              }, sort_keys=True))
              PY
          env:
            - name: WAHM_GIT_COMMIT
              value: __WAHM_GIT_COMMIT__
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: wahm-judge-539948
            readOnly: true
