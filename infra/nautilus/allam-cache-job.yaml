apiVersion: batch/v1
kind: Job
metadata:
  name: wahm-allam-cache
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: wahm
    wahm/stage: allam-cache
spec:
  activeDeadlineSeconds: 14400
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahm
        wahm/stage: allam-cache
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
        - name: cache
          image: python:3.11-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              repo="/workspace/repos/wahm-${WAHM_GIT_COMMIT}"
              if [[ ! -d "${repo}/.git" ]]; then
                git clone "${WAHM_GIT_REPOSITORY}" "${repo}"
              fi
              git -C "${repo}" fetch origin
              git -C "${repo}" checkout --detach "${WAHM_GIT_COMMIT}"
              python -m pip install --no-cache-dir "huggingface-hub>=0.26,<1"
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              from huggingface_hub import snapshot_download

              snapshot = snapshot_download(
                  repo_id=os.environ["WAHM_ALLAM_MODEL"],
                  revision=os.environ["WAHM_ALLAM_REVISION"],
                  cache_dir="/workspace/hf-cache",
                  allow_patterns=[
                      "*.json", "*.model", "*.safetensors", "*.py",
                      "LICENSE*", "README.md",
                  ],
              )
              record = {
                  "model_id": os.environ["WAHM_ALLAM_MODEL"],
                  "revision": os.environ["WAHM_ALLAM_REVISION"],
                  "snapshot_dir": snapshot,
                  "git_commit": os.environ["WAHM_GIT_COMMIT"],
              }
              output = Path("/workspace/artifacts/allam-cache.json")
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps(record, indent=2), encoding="utf-8")
              print(json.dumps(record, indent=2))
              PY
          env:
            - name: WAHM_GIT_COMMIT
              value: __WAHM_GIT_COMMIT__
            - name: WAHM_GIT_REPOSITORY
              value: https://github.com/cyberuniversal/Wahm.git
            - name: WAHM_ALLAM_MODEL
              value: humain-ai/ALLaM-7B-Instruct-preview
            - name: WAHM_ALLAM_REVISION
              value: a28dd1e67420cde72d3629c8633a974cf7d9c366
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: HF_HUB_DISABLE_XET
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: wahm-allam-539948
